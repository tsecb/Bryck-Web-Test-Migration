[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --alluredir=reports/web/allure-results
    -v
    --tb=short
    --strict-markers
    --reruns 1
    --reruns-delay 3
    --only-rerun TimeoutError
markers =
    shipment: migrated tests from legacy web shipment suite
    smoke: fast validation flow
    network: network configuration validation
    storage: storage configuration validation
    api: fast, browser-free checks against the device's management API
    negative: negative-path / invalid-input checks that expect a rejection
    system: System ("Administration") section checks - status/settings/alerts/power/etc.
    object_store: Bryck Storage > Object Store (Bucket/Access/Configure) checks
    settings: System > Settings (Timezone/Session Timeout/Date and Time) checks
    alerts: System > Alerts (Receiver/Email Setup/Notification) checks
    dashboard: top-level Dashboard screen checks
    report: System > Report (bryck diagnostic report generation/download) checks
    data_transfer: Data Transfer > Data Center (transfer/verify) checks
    external_storage: System > External Storage (NFS mount) checks
    mount_eject: Bryck Storage Mount/Unmount (hot-pluggable eject) checks
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
log_date_format = %Y-%m-%dT%H:%M:%S
